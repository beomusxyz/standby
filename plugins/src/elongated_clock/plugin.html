<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Style Clock</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --accent-color: #8bb3f8;
        }

        @font-face {
            font-family: 'GoogleSansFlex';
            src: url('assets/GoogleSansFlex.woff2') format('woff2');
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: 'GoogleSansFlex';
            font-variation-settings: 'wght' 700, 'wdth' 50, 'ROND' 50;
            user-select: none;
            overflow: hidden;
            box-sizing: border-box;
        }

        .clock-container {
            display: flex;
            align-items: stretch;
            gap: 10vh;
        }

        .time-display {
            color: var(--accent-color);
            font-size: 85vh;
            line-height: 0.8;
            letter-spacing: -5px;
        }

        .portrait-time {
            display: none;
        }

        .side-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 0;
            align-items: flex-start;
        }

        .top-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .date-display {
            color: var(--accent-color);
            font-size: 9vh;
            font-weight: 600;
            letter-spacing: 1px;
            font-variation-settings: 'wdth' 100, 'ROND' 50;
        }

        .weather-display {
            font-size: 9vh;
            font-weight: 600;
            font-variation-settings: 'wdth' 100, 'ROND' 50;
        }

        .bottom-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            font-size: 9vh;
            font-weight: 600;
        }

        .alarm-icon {
            width: 10vh;
            height: 10vh;
            margin-left: -1vh;
            fill: var(--accent-color);
        }

        @media (max-aspect-ratio: 1/1) {
            .clock-container {
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 5vh;
                width: 100%;
                height: 100%;
                padding: 4vh 6vw;
                box-sizing: border-box;
            }

            .time-display {
                display: none;
            }

            .portrait-time {
                display: flex;
                flex-direction: column;
                align-items: center;
                color: var(--accent-color);
                font-size: 48vw;
                line-height: 0.72;
                letter-spacing: -4px;
            }

            .side-info {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-end;
                width: 76vw;
                padding: 0;
            }

            .date-display,
            .weather-display,
            .bottom-info {
                font-size: 5vw;
            }

            .alarm-icon {
                width: 6vw;
                height: 6vw;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

<div class="clock-container">
    <div class="time-display" id="time">2:37</div>
    <div class="portrait-time" aria-hidden="true">
        <div id="portrait-hour">02</div>
        <div id="portrait-minute">37</div>
    </div>

    <div class="side-info">
        <div class="top-info">
            <div class="date-display" id="date">MON 01</div>
            <div class="weather-display" id="weather-display">68&deg;</div>
        </div>

        <div class="bottom-info" id="alarm-container" style="display: none;">
            <svg class="alarm-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 20a7 7 0 1 0 0-14 7 7 0 0 0 0 14zm0 2a9 9 0 1 1 0-18 9 9 0 0 1 0 18z"/>
                <path d="M11.5 8h1v4.4l3.2 2.3-.6.8-3.6-2.6V8zM4.3 4.8l1.5-1.4 2.8 2.8-1.5 1.4L4.3 4.8zm15.4-1.4l1.5 1.4-2.8 2.8-1.5-1.4 2.8-2.8z"/>
            </svg>
            <span id="alarm-time"></span>
        </div>
    </div>
</div>

<script>
    let showDate = true;
    let showWeather = true;

    try {
        if (window.AndroidSensors && typeof window.AndroidSensors.getCustomizations === 'function') {
            const saved = JSON.parse(window.AndroidSensors.getCustomizations());
            showDate = saved.showDate ?? showDate;
            showWeather = saved.showWeather ?? showWeather;
        }
    } catch (e) {}

    function updateOptionalInfo() {
        document.getElementById('date').style.display = showDate ? '' : 'none';
        document.getElementById('weather-display').style.display = showWeather ? '' : 'none';
    }

    // Asked fresh each tick rather than cached. The app resolves this: it honours
    // this plugin's TIME_FORMAT if set, otherwise the app setting, otherwise the
    // system's own 12/24 toggle, which JavaScript cannot see from in here.
    function use24Hour() {
        try {
            if (window.AndroidSensors && typeof window.AndroidSensors.getTimeFormat === 'function') {
                return window.AndroidSensors.getTimeFormat() === "24";
            }
        } catch (e) {}
        return false;
    }

    function updateClock() {
        const now = new Date();

        // Format time according to the resolved clock format
        let hours = now.getHours();
        let minutes = now.getMinutes();
        const minStr = minutes < 10 ? '0' + minutes : '' + minutes;

        let timeStr;
        if (use24Hour()) {
            let hoursStr = hours < 10 ? '0' + hours : '' + hours;
            timeStr = `${hoursStr}:${minStr}`;
        } else {
            hours = hours % 12;
            hours = hours ? hours : 12; // Handle midnight/noon (0 becomes 12)
            timeStr = `${hours}:${minStr}`;
        }

        document.getElementById('time').textContent = timeStr;
        document.getElementById('portrait-hour').textContent = hours.toString().padStart(2, '0');
        document.getElementById('portrait-minute').textContent = minStr;

        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const dayName = days[now.getDay()];
        const date = now.getDate();

        document.getElementById('date').textContent = `${dayName} ${date}`;

        // Also check and update the alarm information
        updateAlarm();

        if (showWeather) {
            updateWeather();
        }
    }

    function updateAlarm() {
        let hasAlarm = false;
        let formattedAlarmTime = "";

        if (window.AndroidSensors && typeof window.AndroidSensors.getNextAlarm === 'function') {
            try {
                const alarmRes = JSON.parse(window.AndroidSensors.getNextAlarm());
                hasAlarm = alarmRes.hasAlarm;
                formattedAlarmTime = alarmRes.formattedTime;
            } catch (e) {
                console.error("Failed parsing alarm data from SensorBridge:", e);
            }
        } else {
            hasAlarm = true;
            formattedAlarmTime = "7:30 AM";
        }

        const container = document.getElementById('alarm-container');
        const timeSpan = document.getElementById('alarm-time');

        if (hasAlarm && formattedAlarmTime) {
            timeSpan.textContent = formattedAlarmTime;
            container.style.display = 'flex';
        } else {
            container.style.display = 'none';
        }
    }

    function updateWeather(){
        let temp = 25;
        if (window.AndroidProviders && typeof window.AndroidProviders.getCurrentWeather == 'function') {
            temp = JSON.parse(window.AndroidProviders.getCurrentWeather()).temp;
            document.getElementById('weather-display').innerHTML = `${temp}&deg;`;
        } else {
            document.getElementById('weather-display').innerHTML = `${temp}&deg;`;
        }
    }

    window.onCustomizationChanged = (changes) => {
        showDate = changes.showDate ?? showDate;
        showWeather = changes.showWeather ?? showWeather;
        updateOptionalInfo();
        updateClock();
    };

    updateOptionalInfo();
    updateClock();
    setInterval(updateClock, 1000);
</script>
</body>
</html>
